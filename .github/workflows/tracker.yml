name: Mope.io Engine Tracker

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  
 permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python deps
        run: pip install requests beautifulsoup4

      - name: Run tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python engine_tracker.py --once

      - name: Save state back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mope_scripts/ || true
          git add mope_full.js || true
          git add extension/index.js || true
          git add extension/rules.json || true
          git diff --staged --quiet || git commit -m "auto: new mope.io build"
          git push || true
